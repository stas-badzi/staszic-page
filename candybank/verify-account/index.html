<body>
	
	<div class="limiter">
		<div class="container-login100">
			<div class="wrap-login100">
				<form class="login100-form validate-form">
					<span class="login100-form-title p-b-48">
						<img src="../images/logo.png" class="logo">
						<h1 class="name">
							<span style="color: darkmagenta;">C</span><span style="color: red;">a</span><span style="color: yellow;">n</span><span style="color: blue;">d</span><span style="color: lime;">y</span><br><span style="color: red;">B</span><span style="color: blue;">a</span><span style="color: lime;">n</span><span style="color: darkmagenta;">k</span>
						</h1>
					</span>
					<span class="login100-form-title2 p-b-7">
						Enter your account verification code
					</span>
					<span class="subtitle p-b-28">
						<div>
							<span>We sent it to &lt;</span><i id="your-email">empty@site.com</i>&gt;
						</div>
					</span>

					<div class="wrap-wrap-code">

						<div class="wrap-input100 validate-input" data-validate = "Incorrect code. Try again">
							<input class="input100" type="text" id="num1" type="text"  autofocus>
							<span class="focus-input100"></span>
						</div>

						<div class="wrap-input100 validate-input" data-validate = "Incorrect code. Try again">
							<input class="input100" type="text" id="num2" type="text" >
							<span class="focus-input100"></span>
						</div>

						<div class="wrap-input100 validate-input" data-validate = "Incorrect code. Try again">
							<input class="input100" type="text" id="num3" type="text" >
							<span class="focus-input100"></span>
						</div>

						<div class="wrap-input100 validate-input" data-validate = "Incorrect code. Try again">
							<input class="input100" type="text" id="num4" type="text" >
							<span class="focus-input100"></span>
						</div>

						<div class="wrap-input100 validate-input" data-validate = "Incorrect code. Try again">
							<input class="input100" type="text" id="num5"type="text" >
							<span class="focus-input100"></span>
						</div>

						<div class="wrap-input100 validate-input" data-validate = "Incorrect code. Try again">
							<input class="input100" type="text" id="num6" type="text" >
							<span class="focus-input100"></span>
						</div>

					</div>
					<div class="text-center -m-t-20" id="code-error">Incorrect code. Try again</div>

					<div class="text-center p-t-115">
						<span class="txt1">
							Didn’t recieve the e-mail?
						</span>

						<a class="txt2" id="resend">
							Send again
						</a>
					</div>
				</form>
			</div>
		</div>
